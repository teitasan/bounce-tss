<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ピザSVG 改良案デザインギャラリー</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-dark: #0f131c;
        --bg-card: rgba(23, 31, 48, 0.85);
        --border: #2d3b55;
        --accent: #ff9f43;
        --text: #e8eefc;
        --text-sub: #9aa8c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 24px 80px;
        background: radial-gradient(circle at 50% 0%, #1e283d, var(--bg-dark) 75%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      .container { max-width: 1200px; margin: 0 auto; }
      header { margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
      .lead { color: var(--text-sub); font-size: 14px; margin: 0; }

      /* タブ切り替え */
      .nav-tabs {
        display: flex;
        gap: 8px;
        margin: 24px 0;
        flex-wrap: wrap;
      }
      .tab-btn {
        background: #141b2b;
        color: var(--text-sub);
        border: 1px solid var(--border);
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .tab-btn:hover { background: #202b42; color: #fff; }
      .tab-btn.active {
        background: #ff7733;
        color: #fff;
        border-color: #ff9955;
        box-shadow: 0 4px 14px rgba(255, 119, 51, 0.35);
      }

      /* パターン比較カード */
      .patterns-overview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .pattern-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        transition: transform 0.2s, border-color 0.2s;
      }
      .pattern-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .pattern-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 12px;
        background: #334260;
        color: #cbd5e1;
        font-weight: bold;
      }
      .pattern-badge.recommend {
        background: #ff5e3a;
        color: #fff;
        box-shadow: 0 2px 8px rgba(255, 94, 58, 0.4);
      }
      .pattern-title { font-size: 15px; font-weight: 700; margin: 12px 0 4px; }
      .pattern-desc { font-size: 11.5px; color: var(--text-sub); margin: 0 0 12px; height: 34px; }

      /* セクション */
      h2 {
        font-size: 18px;
        font-weight: 700;
        margin: 36px 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2::before {
        content: '';
        display: inline-block;
        width: 4px;
        height: 18px;
        background: #ff7733;
        border-radius: 2px;
      }

      /* グリッド */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
      }
      .cell {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }
      .cell span { font-size: 12px; font-weight: 600; color: #dbe4f3; }
      .cell small { font-size: 10.5px; color: var(--text-sub); }

      /* サイズ比較表 */
      .size-table {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow-x: auto;
        padding: 16px;
      }
      .size-row {
        display: flex;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #1f2a3f;
      }
      .size-row:last-child { border-bottom: none; }
      .size-label {
        width: 140px;
        flex-shrink: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #9aa8c7;
      }
      .size-items {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .size-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 50px;
      }
      .size-item span { font-size: 10px; color: #7e8da9; }

      /* アニメーションステージ */
      .stage {
        position: relative;
        height: 240px;
        border-radius: 14px;
        background: #0b0e14;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .chef {
        position: absolute;
        left: 140px;
        top: 120px;
        width: 28px;
        height: 28px;
        margin: -14px;
        border-radius: 50%;
        background: #6ef2ff;
        box-shadow: 0 0 18px #6ef2ff88;
      }
      .orbit {
        position: absolute;
        left: 140px;
        top: 120px;
        width: 0;
        height: 0;
        animation: spin 2s linear infinite;
      }
      .orbit > div {
        position: absolute;
        width: 30px;
        height: 30px;
        margin: -15px;
      }
      .orbit > div svg { animation: spin 1s linear infinite reverse; }
      .fly {
        position: absolute;
        top: 100px;
        left: 320px;
        animation: bounce 3s ease-in-out infinite alternate;
      }
      .fly svg { animation: spin 0.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bounce {
        0% { transform: translate(0, -70px); }
        25% { transform: translate(160px, 80px); }
        50% { transform: translate(320px, -50px); }
        75% { transform: translate(480px, 70px); }
        100% { transform: translate(620px, 0); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🍕 ピザSVG 改良案デザイン比較</h1>
        <p class="lead">
          現在のピザ（Before）と、4つの改良コンセプト（After）を比較できます。トッピングごとの見た目、組み合わせ、ゲーム中の実サイズ、回転アニメーションを確認してください。
        </p>
      </header>

      <!-- 概要カード -->
      <div class="patterns-overview" id="overview-cards"></div>

      <!-- 切り替えタブ -->
      <div class="nav-tabs" id="tabs"></div>

      <!-- メイン比較表示 -->
      <h2 id="current-pattern-heading">基本のピザ（強化なし）</h2>
      <div class="grid" id="plain-grid"></div>

      <h2>トッピング別 Lv1 / Lv3（効果の表現）</h2>
      <div class="grid" id="toppings-grid"></div>

      <h2>複合コンボの例</h2>
      <div class="grid" id="combo-grid"></div>

      <h2>ゲーム中実サイズ（22px 周回 / 26px 飛翔 / 34px 手元 / 44px カード / 96px 大）</h2>
      <div class="size-table" id="sizes-table"></div>

      <h2>ゲーム中の動き（自機周回の3枚 ＆ 高速スピンバウンド弾）</h2>
      <div class="stage">
        <div class="chef"></div>
        <div class="orbit" id="orbit"></div>
        <div class="fly" id="fly"></div>
      </div>
    </div>

    <script type="module">
      // 各デザインパターンのSVGジェネレータを定義
      // 共通型: lv: Record<string, number>, size: number, simple?: boolean

      const TOPPINGS_INFO = {
        homing: { name: 'ブラックオリーブ', effect: '追尾' },
        split: { name: '切れ目', effect: '分裂' },
        multi: { name: 'ミニピザ3枚', effect: '3連' },
        pierce: { name: 'ハラペーニョ', effect: '貫通' },
        rebound: { name: 'ふっくら耳', effect: '反発' },
        bounce: { name: 'ペパロニ', effect: '跳弾' },
        accel: { name: '赤唐辛子', effect: '加速' },
        big: { name: '分厚い生地', effect: '巨大化' },
        fast: { name: 'バジル', effect: '高速化' },
      };

      const EFFECT_IDS = ['bounce', 'pierce', 'homing', 'accel', 'fast', 'split', 'rebound', 'big', 'multi'];

      // ==========================================
      // 0. 現行（Current / Before）
      // ==========================================
      const SLOTS_ORIG = [
        ...Array.from({ length: 4 }, (_, i) => [11, i * 90 + 45]),
        ...Array.from({ length: 9 }, (_, i) => [25, i * 40 + 10]),
        [0, 0],
        ...Array.from({ length: 9 }, (_, i) => [25, i * 40 + 30]),
      ];

      function pieceCurrent(kind, rot) {
        const t = `rotate(${rot})`;
        switch (kind) {
          case 'bounce':
            return `<g transform="${t}"><circle r="7.5" fill="#b8322a" stroke="#8e2219" stroke-width="1"/><circle cx="-2.5" cy="-2" r="1.1" fill="#e2695c"/><circle cx="2.4" cy="1.6" r="1" fill="#e2695c"/><circle cx="0.5" cy="-3.6" r=".8" fill="#e2695c"/></g>`;
          case 'homing':
            return `<g transform="${t}"><circle r="4.6" fill="#2b2622"/><circle r="1.8" fill="#f3cf6b"/></g>`;
          case 'pierce':
            return `<g transform="${t}"><circle r="5.6" fill="#5aa83a" stroke="#3d7a25" stroke-width="1"/><circle r="3.4" fill="#c9e7a6"/><circle cx="-1" cy="-.8" r=".7" fill="#f4f0d8"/><circle cx="1.2" cy=".6" r=".7" fill="#f4f0d8"/><circle cx="-.2" cy="1.5" r=".7" fill="#f4f0d8"/></g>`;
          case 'accel':
            return `<g transform="${t}"><path d="M-7 1 Q-1 -6 7 -2 Q1 3 -7 1Z" fill="#e2382c" stroke="#a5221a" stroke-width=".8"/><path d="M7 -2 l3 -2.5" stroke="#3f8f3a" stroke-width="1.8" stroke-linecap="round"/></g>`;
          case 'fast':
            return `<g transform="${t}"><ellipse rx="7" ry="3.6" fill="#3f8f3a"/><path d="M-6 0 H6" stroke="#2c6a28" stroke-width=".8"/></g>`;
          default:
            return '';
        }
      }

      function pizzaCurrent(lv, size = 64, simple = size < 48) {
        function body(lv, cx, cy, R, isSimple) {
          const L = (e) => lv[e] ?? 0;
          const k = R / 48;
          const thick = L('big') > 0;
          const inner = (thick ? 38 : 42) * k;
          let s = `<g>`;
          if (L('rebound') > 0) {
            const n = 14;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2;
              s += `<circle cx="${(cx + Math.cos(a) * (R - 3 * k)).toFixed(1)}" cy="${(cy + Math.sin(a) * (R - 3 * k)).toFixed(1)}" r="${(7 + 1.5 * Math.min(3, L('rebound'))) * k}" fill="#e8a95a" stroke="#b97a35" stroke-width="${1.2 * k}"/>`;
            }
          }
          s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${thick ? '#c98a45' : '#d99a4e'}" stroke="#a96c2e" stroke-width="${(thick ? 3 : 2) * k}"/>`;
          s += `<circle cx="${cx}" cy="${cy}" r="${inner}" fill="#c4422c"/>`;
          s += `<circle cx="${cx}" cy="${cy}" r="${inner - 3 * k}" fill="#f3cf6b"/>`;
          for (const [dx, dy, r] of [[-12, -8, 7], [10, 12, 6], [14, -14, 5], [-16, 14, 5]]) {
            s += `<circle cx="${cx + dx * k}" cy="${cy + dy * k}" r="${r * k}" fill="#f8e3a0" opacity=".8"/>`;
          }
          const list = [];
          for (const e of ['bounce', 'pierce', 'homing', 'accel', 'fast']) {
            for (let i = 0; i < (isSimple ? Math.min(1, L(e)) : 2 * L(e)); i++) list.push(e);
          }
          const simpleSlots = [[], [[0, 0]], [[14, 180], [14, 0]], [[15, 210], [15, 330], [15, 90]], [[15, 225], [15, 315], [15, 45], [15, 135]], [[0, 0], [17, 225], [17, 315], [17, 45], [17, 135]]];
          const slots = isSimple ? simpleSlots[Math.min(list.length, 5)] : SLOTS_ORIG;
          list.slice(0, slots.length).forEach((e, i) => {
            const [d, deg] = slots[i];
            const a = (deg * Math.PI) / 180;
            const scale = (inner / (42 * k)) * k * (isSimple ? (list.length === 1 ? 2.6 : 1.8) : 1);
            const pos = (inner / (42 * k)) * k;
            s += `<g transform="translate(${cx + Math.cos(a) * d * pos} ${cy + Math.sin(a) * d * pos}) scale(${scale})">${pieceCurrent(e, isSimple ? 0 : deg * 2)}</g>`;
          });
          const cuts = L('split') > 0 ? (isSimple ? 2 : 1 + L('split')) : 0;
          for (let i = 0; i < cuts; i++) {
            const a = (i / cuts) * Math.PI;
            const dx = Math.cos(a) * inner;
            const dy = Math.sin(a) * inner;
            s += `<line x1="${cx - dx}" y1="${cy - dy}" x2="${cx + dx}" y2="${cy + dy}" stroke="#fff4d6" stroke-width="${(isSimple ? 4 : 2.2) * k}" stroke-linecap="round" opacity=".9"/>`;
          }
          return s + '</g>';
        }

        let b = '';
        if ((lv.multi ?? 0) > 0) {
          for (let i = 0; i < 3; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / 3;
            b += body({ ...lv, multi: 0 }, 50 + Math.cos(a) * 25, 50 + Math.sin(a) * 25, 24, simple);
          }
        } else {
          b = body(lv, 50, 50, 48, simple);
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="-6 -6 112 112" aria-hidden="true">${b}</svg>`;
      }

      // ==========================================
      // 1. パターンA: ベイクド＆リッチ（焼き立て・シズル感）★おすすめ
      // ==========================================
      function pizzaPatternA(lv, size = 64, simple = size < 48) {
        const uid = 'pA_' + Math.random().toString(36).substring(2, 7);
        function pieceA(kind, rot) {
          const t = `rotate(${rot})`;
          switch (kind) {
            case 'bounce': // ペパロニ: 縁が少し焦げて立ち上がったカップペパロニ、肉のツヤとスパイス点
              return `<g transform="${t}">
                <circle r="7.8" fill="#a82318" stroke="#68120a" stroke-width="1"/>
                <circle r="6.6" fill="#c83628"/>
                <ellipse cx="-1.5" cy="-1.5" rx="4" ry="2.8" fill="#df4d3c" opacity="0.8"/>
                <circle cx="-2.5" cy="-2.5" r="1.3" fill="#ffffff" opacity="0.6"/>
                <circle cx="2.2" cy="2.2" r="0.9" fill="#580f08"/>
                <circle cx="-1.2" cy="2.8" r="0.8" fill="#580f08"/>
                <circle cx="3.2" cy="-1.2" r="0.7" fill="#580f08"/>
              </g>`;
            case 'homing': // オリーブ: リング状の断面スライス（真ん中に穴）、オリーブ特有の深いパープルブラックと立体光沢
              return `<g transform="${t}">
                <ellipse rx="5.4" ry="4.4" fill="#1e181e" stroke="#100d11" stroke-width="0.8"/>
                <ellipse rx="2.5" ry="2.0" fill="#f8b63a"/>
                <ellipse rx="2.2" ry="1.7" fill="#c43d26" opacity="0.7"/>
                <path d="M -3.5 -2 A 4.2 3.4 0 0 1 2.5 -3" stroke="#5a4e5c" stroke-width="0.9" fill="none" stroke-linecap="round"/>
              </g>`;
            case 'pierce': // ハラペーニョ: リアルな波打つ断面リング、鮮やかなグリーン果肉とクリーム色の種
              return `<g transform="${t}">
                <path d="M0 -6 C3 -6 5.5 -4 5.8 -1 C6 2 4.5 5.5 1 5.8 C-3 6 -5.5 4 -5.8 0 C-6 -3 -4 -5.8 0 -6 Z" fill="#3d8224" stroke="#255514" stroke-width="0.9"/>
                <circle r="3.6" fill="#8ed05e"/>
                <circle r="2.4" fill="#f6c244" opacity="0.85"/>
                <circle cx="-1.1" cy="-0.8" r="0.9" fill="#fff9dc"/>
                <circle cx="1.2" cy="0.6" r="0.8" fill="#fff9dc"/>
                <circle cx="-0.2" cy="1.4" r="0.8" fill="#fff9dc"/>
              </g>`;
            case 'accel': // 赤唐辛子: ツヤとグラデーションのあるホットチリペッパーと緑のヘタ
              return `<g transform="${t}">
                <path d="M-8 2 Q-2 -7 7 -2 Q2 4 -8 2Z" fill="#d92a1c" stroke="#87130a" stroke-width="0.8"/>
                <path d="M-5 0.5 Q-1 -4 4 -2" stroke="#ff7c70" stroke-width="1.1" fill="none" opacity="0.85" stroke-linecap="round"/>
                <path d="M7 -2 Q9 -3 10.5 -5" stroke="#38852e" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <circle cx="7" cy="-2" r="1.3" fill="#2d6a25"/>
              </g>`;
            case 'fast': // バジル: 先端がツンと尖ったリアルなフレッシュバジル葉＋葉脈
              return `<g transform="${t}">
                <path d="M -7 0 C -4 -5 4 -4.5 7.5 0 C 4 4.5 -4 5 -7 0 Z" fill="#2e8b28" stroke="#1d5c19" stroke-width="0.7"/>
                <path d="M -5.5 0 C -2 -1 3 -0.5 6 0" stroke="#85d87a" stroke-width="0.9" fill="none" stroke-linecap="round"/>
                <path d="M -1 0 Q 1 -2 3 -2" stroke="#85d87a" stroke-width="0.6" fill="none"/>
                <path d="M -1 0 Q 1 2 3 2" stroke="#85d87a" stroke-width="0.6" fill="none"/>
              </g>`;
            default:
              return '';
          }
        }

        function body(lv, cx, cy, R, isSimple) {
          const L = (e) => lv[e] ?? 0;
          const k = R / 48;
          const thick = L('big') > 0;
          const inner = (thick ? 37 : 41.5) * k;
          let s = `<g>`;

          // rebound (反発): オーブンでふっくら盛り上がった香ばしい耳（チーズインクラスト）
          if (L('rebound') > 0) {
            const n = 15;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2;
              const dist = R - 2.5 * k;
              const bx = (cx + Math.cos(a) * dist).toFixed(1);
              const by = (cy + Math.sin(a) * dist).toFixed(1);
              const br = (7.5 + 1.8 * Math.min(3, L('rebound'))) * k;
              s += `<circle cx="${bx}" cy="${by}" r="${br}" fill="#df9444" stroke="#a45f22" stroke-width="${1.2 * k}"/>`;
              // 焦げ目
              if (i % 2 === 0) {
                s += `<ellipse cx="${bx}" cy="${by}" rx="${br * 0.4}" ry="${br * 0.25}" fill="#6b350e" opacity="0.65" transform="rotate(${(a * 180 / Math.PI) + 90} ${bx} ${by})"/>`;
              }
            }
          }

          // 生地の耳（ふっくらグラデーション＋焼き色）
          s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${thick ? '#b87232' : '#d88d44'}" stroke="#914f1d" stroke-width="${(thick ? 3.2 : 2.2) * k}"/>`;
          // 耳の内側ハイライトとオーブンの焦げ斑点（char marks）
          s += `<circle cx="${cx}" cy="${cy}" r="${R - 3 * k}" fill="none" stroke="#f0b162" stroke-width="${2 * k}" opacity="0.7"/>`;
          // オーブンの焦げ目斑点
          for (let i = 0; i < 7; i++) {
            const a = (i / 7) * Math.PI * 2 + 0.3;
            const dist = R - 3.2 * k;
            const px = cx + Math.cos(a) * dist;
            const py = cy + Math.sin(a) * dist;
            s += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(1.5 + (i % 2)) * k}" ry="${1.2 * k}" fill="#542506" opacity="0.6" transform="rotate(${i * 45} ${px} ${py})"/>`;
          }

          // トマトソース（自然なにじみ）
          s += `<circle cx="${cx}" cy="${cy}" r="${inner}" fill="#ba2918" stroke="#87170a" stroke-width="${0.8 * k}"/>`;
          // とろ〜りチーズ（中心は熱々イエロー、フチは濃厚ゴールド）
          s += `<circle cx="${cx}" cy="${cy}" r="${inner - 2.8 * k}" fill="#fec447"/>`;
          // チーズのこんがり焦げ目スポット（焼き立てオーブン感）
          const toasts = [
            [-11, -9, 7, 5, 25],
            [12, 10, 6.5, 4.5, -30],
            [13, -13, 5.5, 4, 15],
            [-14, 12, 6, 4.5, -45],
            [0, -15, 4.5, 3, 0],
            [-2, 14, 5, 3.5, 60]
          ];
          for (const [dx, dy, rx, ry, rot] of toasts) {
            const px = cx + dx * k;
            const py = cy + dy * k;
            s += `<ellipse cx="${px}" cy="${py}" rx="${rx * k}" ry="${ry * k}" fill="#e69628" opacity="0.75" transform="rotate(${rot} ${px} ${py})"/>`;
            s += `<ellipse cx="${px}" cy="${py}" rx="${(rx * 0.5) * k}" ry="${(ry * 0.4) * k}" fill="#9d4b0d" opacity="0.45" transform="rotate(${rot} ${px} ${py})"/>`;
          }

          // トッピング配置
          const list = [];
          for (const e of ['bounce', 'pierce', 'homing', 'accel', 'fast']) {
            for (let i = 0; i < (isSimple ? Math.min(1, L(e)) : 2 * L(e)); i++) list.push(e);
          }
          const simpleSlots = [[], [[0, 0]], [[14, 180], [14, 0]], [[15, 210], [15, 330], [15, 90]], [[15, 225], [15, 315], [15, 45], [15, 135]], [[0, 0], [17, 225], [17, 315], [17, 45], [17, 135]]];
          const slots = isSimple ? simpleSlots[Math.min(list.length, 5)] : SLOTS_ORIG;
          list.slice(0, slots.length).forEach((e, i) => {
            const [d, deg] = slots[i];

          <div class="cell">
            ${p.render({}, 80, false)}
            <span>中サイズ (80px)</span>
          </div>
          <div class="cell">
            ${p.render({}, 44, true)}
            <span>ゲーム中 (44px)</span>
            <small>ドラフト用</small>
          </div>
          <div class="cell">
            ${p.render({}, 26, true)}
            <span>弾サイズ (26px)</span>
            <small>バトル中の弾</small>
          </div>
        `;
        document.getElementById('plain-grid').innerHTML = plainHtml;

        // 2. トッピング別
        const toppingsHtml = EFFECT_IDS.map((e) => {
          const info = TOPPINGS_INFO[e];
          return `
            <div class="cell">
              ${p.render({ [e]: 1 }, 96, false)}
              <span>${info.effect} Lv1</span>
              <small>${info.name}</small>
            </div>
            <div class="cell">
              ${p.render({ [e]: 3 }, 96, false)}
              <span>${info.effect} Lv3</span>
              <small>${info.name} × 3</small>
            </div>
          `;
        }).join('');
        document.getElementById('toppings-grid').innerHTML = toppingsHtml;

        // 3. コンボ
        const combos = [
          [{ bounce: 2, fast: 1 }, '跳弾2・高速1', 'ペパロニ＋バジル'],
          [{ homing: 2, pierce: 1 }, '追尾2・貫通1', 'オリーブ＋ハラペーニョ'],
          [{ split: 1, rebound: 1 }, '分裂1・反発1', '切れ目＋ふっくら耳'],
          [{ multi: 1, bounce: 1 }, '3連1・跳弾1', 'ミニピザ3枚'],
          [{ bounce: 2, accel: 1, fast: 1 }, '跳弾2・加速1・高速1', 'ペパロニ＋唐辛子＋バジル'],
          [{ homing: 1, split: 1, pierce: 1, rebound: 1, bounce: 1, accel: 1, big: 1, fast: 1 }, '全部盛り Lv1', 'デラックスピザ'],
          [{ homing: 3, pierce: 3, bounce: 3 }, '最強コンボ Lv3', 'オリーブ・ハラペーニョ・ペパロニ'],
          [{ big: 2, rebound: 2 }, '極厚チーズ耳', '分厚い生地＋ふっくら耳'],
        ];
        document.getElementById('combo-grid').innerHTML = combos.map(([lv, title, sub]) => `
          <div class="cell">
            ${p.render(lv, 110, false)}
            <span>${title}</span>
            <small>${sub}</small>
          </div>
        `).join('');

        // 4. 実サイズ比較
        const sampleLvs = [
          [{}, '強化なし'],
          [{ homing: 1 }, '追尾1'],
          [{ pierce: 2 }, '貫通2'],
          [{ split: 1, rebound: 1 }, '分裂1反発1'],
          [{ multi: 1 }, '3連1'],
          [{ bounce: 2, accel: 1 }, '跳弾2加速1'],
          [{ big: 2 }, '巨大化2'],
        ];
        const sizes = [22, 26, 34, 44, 96];
        let sizeHtml = `
          <div class="size-row">
            <div class="size-label">効果</div>
            <div class="size-items">
              ${sampleLvs.map(([_, name]) => `<div class="size-item" style="width:70px"><span>${name}</span></div>`).join('')}
            </div>
          </div>
        `;
        sizes.forEach((sz) => {
          sizeHtml += `
            <div class="size-row">
              <div class="size-label">${sz}px (詳細版)</div>
              <div class="size-items">
                ${sampleLvs.map(([lv]) => `<div class="size-item" style="width:70px">${p.render(lv, sz, false)}</div>`).join('')}
              </div>
            </div>
            <div class="size-row">
              <div class="size-label">${sz}px (簡略版)</div>
              <div class="size-items">
                ${sampleLvs.map(([lv]) => `<div class="size-item" style="width:70px">${p.render(lv, sz, true)}</div>`).join('')}
              </div>
            </div>
          `;
        });
        document.getElementById('sizes-table').innerHTML = sizeHtml;

        // 5. アニメーションステージ
        const orbitLvs = [{ homing: 1 }, { split: 1, pierce: 1 }, { bounce: 2 }];
        document.getElementById('orbit').innerHTML = orbitLvs
          .map((lv, i) => {
            const a = (i / 3) * Math.PI * 2;
            return `<div style="left:${Math.cos(a) * 36}px;top:${Math.sin(a) * 36}px">${p.render(lv, 28, true)}</div>`;
          })
          .join('');
        document.getElementById('fly').innerHTML = p.render({ bounce: 2, accel: 1, fast: 1 }, 32, true);
      }

      // 初回実行
      renderOverviewCards();
      renderTabs();
      renderMainView();
    </script>
  </body>
</html>
